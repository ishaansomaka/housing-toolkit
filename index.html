<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlanta Region Housing Pressure Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1d3a2f; --pine-strong:#1d3a2f; --river:#2f6f8f; --amber:#b86e00; --ink:#17201b; --muted:#56615b;
  --paper:#f6f7f4; --surface:#ffffff; --line:#d9ded8; --tint:#e7eee9; --amber-tint:#fbf1e1; --bar:#9fb3a8; --focus:#2f6f8f; --heroText:#ffffff; --heroSub:#dfeee6; --heroBg:#1d3a2f; --accentLine:#8fc4a8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --pine:#9fd1b8; --river:#7fb8d6; --amber:#f0b35a; --ink:#e8ede9; --muted:#a7b3ac; --paper:#101713; --surface:#16201a; --line:#2c3a32; --tint:#1d2b23; --amber-tint:#2e2414; --bar:#4f6a5c; --focus:#7fb8d6; --heroBg:#0d2219;}}
:root[data-theme="dark"]{
  --pine:#9fd1b8; --river:#7fb8d6; --amber:#f0b35a; --ink:#e8ede9; --muted:#a7b3ac; --paper:#101713; --surface:#16201a; --line:#2c3a32; --tint:#1d2b23; --amber-tint:#2e2414; --bar:#4f6a5c; --focus:#7fb8d6; --heroBg:#0d2219;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
a{color:var(--river)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:750;color:var(--pine);font-size:16px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{padding:17px 9px 15px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:550;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--pine);border-bottom-color:var(--pine)}
.countybar{background:var(--tint);border-bottom:1px solid var(--line);font-size:15px}
.countybar .wrap{display:flex;align-items:center;gap:10px;min-height:44px;flex-wrap:wrap}
.countybar select, .field select, .field input, .field textarea, .ctl select{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.page{display:none;padding:40px 0 64px}
.page.active{display:block}
h1{font-size:clamp(30px,5vw,50px);line-height:1.1;font-weight:800;margin:0 0 18px;letter-spacing:-0.01em}
h2{font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--pine);font-weight:750}
h3{font-size:19px;margin:0 0 6px}
.intro{color:var(--muted);max-width:68ch;margin:0 0 26px}
.hero{background:var(--heroBg);color:var(--heroText);border-radius:14px;padding:44px 40px;margin-bottom:34px}
.hero h1{max-width:17ch}
.hero .inline-select{font:inherit;font-weight:800;color:#fff;background:transparent;border:none;border-bottom:4px solid var(--accentLine);padding:0 4px 2px 0;cursor:pointer;appearance:none;-webkit-appearance:none;max-width:100%}
.hero .inline-select option{color:#17201b;font-size:18px;font-weight:500}
.hero .lede{font-size:19px;max-width:62ch;color:var(--heroSub);margin:0}
.hero .by{margin-top:20px;font-size:14px;color:#b9d6c6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:36px}
.stat{padding:18px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:none;padding-left:0}
.stat .v{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:14px;color:var(--muted);margin-top:4px}
.finding{border-left:4px solid var(--amber);background:var(--amber-tint);padding:18px 22px;border-radius:0 10px 10px 0;margin:0 0 30px;max-width:78ch}
.finding h3{color:var(--amber)}
.finding p{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.card p:last-child{margin-bottom:0}
.linkbtn{display:inline-block;margin-top:10px;font-weight:650;color:var(--river);text-decoration:none}
.linkbtn:hover{text-decoration:underline}
/* signals */
.signals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.signal{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.signal.on{background:var(--amber-tint);border-color:var(--amber)}
.signal .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.signal.on .mark{background:var(--amber);border-color:var(--amber)}
.signal .t{font-weight:650}
.signal .d{color:var(--muted);font-size:15px}
.summary{font-size:19px;margin:0 0 18px;max-width:66ch}
.note{font-size:15px;color:var(--muted);border-left:3px solid var(--river);padding:4px 0 4px 14px;margin-top:22px;max-width:72ch}
/* indicators */
.ind{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr);gap:28px;padding:22px 0;border-top:1px solid var(--line)}
.ind .what{color:var(--muted);font-size:15px;margin:0}
.ind .why{font-size:15px;margin:8px 0 0}
.nums{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.nums .now{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
.nums .was{color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--tint);color:var(--pine)}
.badge.noise{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.dumb{width:100%;height:auto;display:block;margin-top:8px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:28px;align-items:start}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl label{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;padding:6px 12px;border:none;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--paper)}
#mapsvg{width:100%;height:auto;display:block}
#mapsvg path{stroke:var(--surface);stroke-width:1.5;cursor:pointer;transition:opacity .15s}
#mapsvg path.sel{stroke:var(--amber);stroke-width:3.5}
#mapsvg path:focus{outline:none;stroke:var(--focus);stroke-width:3.5}
#mapsvg text{pointer-events:none;font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.maplegend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}
.maplegend .ramp{height:10px;flex:0 0 180px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--pine) 12%,transparent),var(--pine))}
.detail .big{font-size:36px;font-weight:750;font-variant-numeric:tabular-nums}
.detail table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.detail td{padding:6px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* charts */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;min-width:560px;width:100%;height:auto}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:30;max-width:240px}
table.data{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th button{font:inherit;font-weight:650;color:var(--muted);background:none;border:none;cursor:pointer;padding:0}
table.data th button[aria-sort]{color:var(--pine)}
table.data tr.me td{background:var(--tint);font-weight:650}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
/* form */
.form{display:grid;gap:18px;max-width:640px}
.field label,.field legend{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field .hint{font-size:14px;color:var(--muted);margin:-2px 0 8px}
.field input,.field textarea,.field select{width:100%}
.field textarea{min-height:110px;resize:vertical}
fieldset{border:none;padding:0;margin:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{font-weight:400;display:flex;gap:8px;align-items:flex-start;font-size:15px;margin:0}
.checks input{width:auto;margin-top:4px}
button.primary{font:inherit;font-weight:700;background:var(--pine);color:var(--paper);border:none;border-radius:8px;padding:12px 22px;cursor:pointer;justify-self:start}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.status{padding:12px 16px;border-radius:8px;font-size:15px;display:none}
.status.show{display:block}
.status.ok{background:var(--tint);color:var(--pine)}
.status.err{background:var(--amber-tint);color:var(--amber)}
.method ol{padding-left:22px;max-width:72ch}
.method li{margin-bottom:10px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px}
@media (max-width:820px){.mapwrap,.grid2,.ind{grid-template-columns:1fr;gap:14px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:none;padding-left:0}.hero{padding:30px 22px}.checks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.langbtn{font:inherit;font-size:14px;font-weight:650;padding:6px 14px;border-radius:999px;border:1.5px solid var(--pine);background:transparent;color:var(--pine);cursor:pointer;white-space:nowrap}
.langbtn:hover{background:var(--tint)}
.langnote{display:none;margin:18px 0 0;font-size:14px;color:var(--muted);background:var(--tint);padding:10px 14px;border-radius:8px}
.steps{padding-left:22px;margin:0}.steps li{margin-bottom:10px}
.sigrank{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.srow{font:inherit;display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.srow:hover{border-color:var(--pine)}
.srow.me{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.srow .nm{font-weight:650}
.srow .dots{display:flex;gap:5px}
.srow .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.srow .dots i.on{background:var(--amber);border-color:var(--amber)}
.srow .ct{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <div class="brand" data-t="brand"></div>
  <nav class="tabs" aria-label="Main">
    <a href="#overview" data-t="tab_overview"></a><a href="#map" data-t="tab_map"></a><a href="#profile" data-t="tab_profile"></a><a href="#compare" data-t="tab_compare"></a><a href="#future" data-t="tab_future"></a><a href="#report" data-t="tab_report"></a><a href="#method" data-t="tab_method"></a>
  </nav>
  <button type="button" class="langbtn" id="langBtn"></button>
</div></header>
<div class="countybar" id="countybar"><div class="wrap">
  <label for="countySel" data-t="viewing"></label><select id="countySel"></select>
  <span style="color:var(--muted)" data-t="carries"></span>
</div></div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<main class="wrap">
<p class="langnote" id="langNote" data-t="lang_note"></p>

<section class="page" id="page-overview" aria-labelledby="h-overview">
  <div class="hero">
    <h1 id="h-overview"><span data-t="hero_a"></span> <label for="heroSel" class="sr">County</label><select id="heroSel" class="inline-select"></select> <span data-t="hero_b"></span></h1>
    <p class="lede" id="lede"></p>
    <p class="by" data-t="by"></p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="finding"><h3 data-t="finding_h"></h3><p id="regionFinding"></p></div>

  <div class="grid2" style="margin-bottom:36px">
    <div>
      <h2 data-t="why_h"></h2>
      <p data-t="why_p1"></p>
      <p data-t="why_p2"></p>
    </div>
    <div>
      <h2 data-t="use_h"></h2>
      <ol class="steps">
        <li data-t="use_1"></li>
        <li data-t="use_2"></li>
        <li data-t="use_3"></li>
        <li data-t="use_4"></li>
      </ol>
    </div>
  </div>

  <h2 data-t="rank_h"></h2>
  <p class="intro" data-t="rank_p"></p>
  <div class="sigrank" id="sigrank"></div>

  <div class="grid2" style="margin-top:36px">
    <div class="card"><h3 data-t="card1_h"></h3><p data-t="card1_p"></p><a class="linkbtn" href="#map" data-t="card1_a"></a></div>
    <div class="card"><h3 data-t="card2_h"></h3><p data-t="card2_p"></p><a class="linkbtn" href="#report" data-t="card2_a"></a></div>
  </div>
</section>

<section class="page" id="page-map" aria-labelledby="h-map">
  <h2 id="h-map" data-t="map_h"></h2>
  <p class="intro" data-t="map_p"></p>
  <div class="ctl"><label for="mapMetric" data-t="indicator"></label><select id="mapMetric"></select></div>
  <div class="mapwrap">
    <div><svg id="mapsvg" role="group"></svg>
      <div class="maplegend"><span id="lgMin"></span><span class="ramp" aria-hidden="true"></span><span id="lgMax"></span></div>
    </div>
    <div class="card detail" id="mapDetail" aria-live="polite"></div>
  </div>
</section>

<section class="page" id="page-profile" aria-labelledby="h-profile">
  <h2 id="h-profile"></h2>
  <p class="intro" data-t="prof_p"></p>
  <h3 data-t="sig_h"></h3>
  <p class="summary" id="sigsum"></p>
  <ul class="signals" id="siglist"></ul>
  <p class="note" data-t="sig_note"></p>
  <h3 style="margin-top:40px" data-t="ind_h"></h3>
  <p class="intro" style="margin-bottom:6px" data-t="ind_p"></p>
  <div id="indlist"></div>
</section>

<section class="page" id="page-compare" aria-labelledby="h-compare">
  <h2 id="h-compare" data-t="cmp_h"></h2>
  <p class="intro" data-t="cmp_p"></p>
  <h3 data-t="rankc_h"></h3>
  <div class="ctl"><label for="rankMetric" data-t="indicator"></label><select id="rankMetric"></select></div>
  <div class="chartbox" id="rankchart"></div>
  <h3 style="margin-top:40px" data-t="sc_h"></h3>
  <p class="intro" style="margin-bottom:12px" data-t="sc_p"></p>
  <div class="ctl"><label for="xMetric" data-t="across"></label><select id="xMetric"></select><label for="yMetric" data-t="up"></label><select id="yMetric"></select></div>
  <div class="chartbox" id="scatter"></div>
  <h3 style="margin-top:40px" data-t="tbl_h"></h3>
  <p class="intro" style="margin-bottom:12px" data-t="tbl_p"></p>
  <div class="tablewrap" id="tablewrap"></div>
</section>

<section class="page" id="page-future" aria-labelledby="h-future">
  <h2 id="h-future" data-t="fut_h"></h2>
  <p class="intro" data-t="fut_p"></p>
  <div class="chartbox" id="fcchart"></div>
  <h3 style="margin-top:36px" data-t="share_h"></h3>
  <p class="intro" style="margin-bottom:12px" data-t="share_p"></p>
  <div class="chartbox" id="sharechart"></div>
  <p class="note" data-t="fut_note"></p>
</section>

<section class="page" id="page-report" aria-labelledby="h-report">
  <h2 id="h-report" data-t="rep_h"></h2>
  <p class="intro" data-t="rep_p"></p>
  <div class="grid2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <form class="form" id="reportForm" novalidate>
      <div class="field"><label for="fCounty" data-t="f_county"></label><select id="fCounty"></select></div>
      <div class="field"><label for="fArea" data-t="f_area"></label><p class="hint" data-t="f_area_h"></p><input id="fArea" maxlength="80" autocomplete="off"></div>
      <fieldset class="field"><legend data-t="f_types"></legend><p class="hint" data-t="f_types_h"></p><div class="checks" id="fTypes"></div></fieldset>
      <div class="field"><label for="fWhen" data-t="f_when"></label><select id="fWhen"></select></div>
      <div class="field"><label for="fRole" data-t="f_role"></label><select id="fRole"></select></div>
      <div class="field"><label for="fText" data-t="f_text"></label><p class="hint" data-t="f_text_h"></p><textarea id="fText" maxlength="600"></textarea></div>
      <input type="text" id="fHp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
      <div class="status" id="fStatus" role="status"></div>
      <button type="submit" class="primary" id="fSubmit" data-t="f_submit"></button>
    </form>
    <div>
      <div class="card"><h3 data-t="rs_h"></h3><div id="reportSummary"></div></div>
      <div class="card" style="margin-top:18px"><h3 data-t="help_h"></h3><p style="font-size:15px;margin:0" data-t="help_p"></p></div>
    </div>
  </div>
</section>

<section class="page method" id="page-method" aria-labelledby="h-method">
  <h2 id="h-method" data-t="m_h"></h2>
  <p class="intro" data-t="m_p"></p>
  <div class="grid2">
    <div><h3 data-t="m_sig_h"></h3><ol id="mSignals"></ol></div>
    <div><h3 data-t="m_data_h"></h3><ul id="mData"></ul></div>
  </div>
  <h3 style="margin-top:28px" data-t="m_next_h"></h3>
  <div class="tablewrap"><table class="data" style="font-size:15px"><thead><tr><th data-t="m_add"></th><th style="text-align:left" data-t="m_why"></th></tr></thead><tbody id="mNext"></tbody></table></div>
  <h3 style="margin-top:28px" data-t="m_about_h"></h3>
  <p style="max-width:72ch" data-t="m_about_p"></p>
  <p>Ishaan Somaka</p>
</section>
</main>
<footer><div class="wrap" data-t="footer"></div></footer>
<script>

(function(){let a=1e9,b=-1e9,c=1e9,d=-1e9;const rings=f=>f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;

let db=null,reportDocs=null,dbState='loading';
function setupForm(){
 document.getElementById('reportForm').addEventListener('submit',async ev=>{
  ev.preventDefault();const st=document.getElementById('fStatus'),btn=document.getElementById('fSubmit'),box=document.getElementById('fTypes');
  const types=[...box.querySelectorAll('input:checked')].map(x=>x.value),show=(cls,msg)=>{st.className='status show '+cls;st.textContent=msg;};
  if(!types.length){show('err',L('Choose at least one thing you are seeing.','Elija al menos una cosa que esté viendo.'));return;}
  const text=document.getElementById('fText').value.trim(),area=document.getElementById('fArea').value.trim();
  if(/\d{3}[-.\s]?\d{3}[-.\s]?\d{4}/.test(text+area)){show('err',L('Please remove the phone number before submitting.','Por favor elimine el número de teléfono antes de enviar.'));return;}
  if(!FORM_ENDPOINT){show('err',L('The reporting form is being set up. Please check back soon.','El formulario de reportes se está configurando. Vuelva pronto.'));return;}
  if(document.getElementById('fHp').value){return;}
  btn.disabled=true;
  try{const res=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({county:document.getElementById('fCounty').value,area,types:types.join('; '),when:document.getElementById('fWhen').value,role:document.getElementById('fRole').value,text,language:lang,submittedAt:new Date().toISOString()})});
   if(!res.ok)throw new Error('bad');
   show('ok',L('Thank you. Your report was sent.','Gracias. Su reporte fue enviado.'));ev.target.reset();document.getElementById('fCounty').value=current;}
  catch(e){show('err',L('Your report could not be sent. Check your connection and try again.','No se pudo enviar su reporte. Revise su conexión e intente de nuevo.'));}
  finally{btn.disabled=false;}});
}

const PAGES=['overview','map','profile','compare','future','report','method'];
